[defaults]
# 主机清单文件
inventory = ./hosts

# 关闭首次连接 host key 检查
host_key_checking = False

# 并发数（默认 5）
forks = 5

# 超时时间（秒）
timeout = 30

# 日志路径
log_path = ./ansible.log

# 关闭被弃用警告（兼容 Ansible 2.9.27）
deprecation_warnings = False

# 重试文件
retry_files_enabled = False

# 显示跳过的任务
display_skipped_hosts = False

[ssh_connection]
# SSH 连接复用，加速多次连接
control_path = %(directory)s/%%h-%%r
pipelining = True

---
- hosts: k8s_cluster
  become: true
  tasks:
    - name: Reset all kubeadm state
      command: "{{ item }}"
      with_items:
        - kubeadm reset -f
        - rm -rf /etc/cni/net.d /var/lib/cni
        - rm -rf "$HOME/.kube" /etc/kubernetes/ /var/lib/kubelet /var/lib/dockershim /var/run/kubernetes /var/lib/etcd /var/openebs/

    - name: Reboot
      reboot:

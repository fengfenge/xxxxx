---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# ============================================================
# Deployment - 回显服务
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n9e-echo
  namespace: monitoring
  labels:
    app: n9e-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n9e-echo
  template:
    metadata:
      labels:
        app: n9e-echo
    spec:
      containers:
        - name: n9e-echo
          image: harbor.tian-power.cloud/library/n9e-echo:0.0.1         # ← 改成你的镜像地址
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
# ============================================================
# Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: n9e-echo
  namespace: monitoring
  labels:
    app: n9e-echo
spec:
  selector:
    app: n9e-echo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

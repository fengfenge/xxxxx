---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# ============================================================
# ConfigMap - 语音通知配置（非敏感信息）
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: n9e-voice-config
  namespace: monitoring
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8085"
  ALIYUN_TTS_CODE: "TTS_28726****"        # 替换为你的 TTS 模板 ID
  ALIYUN_PLAY_TIMES: "2"
  SKIP_RECOVERY_CALL: "true"             # 恢复事件不打电话
---
# ============================================================
# Secret - 阿里云凭证（敏感信息，建议用 SealedSecret）
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: n9e-voice-secret
  namespace: monitoring
type: Opaque
stringData:
  ALIYUN_ACCESS_KEY_ID: "你的AccessKey ID"
  ALIYUN_ACCESS_KEY_SECRET: "你的AccessKey Secret"
  # 如果有专属号码（被叫显号）：
  # ALIYUN_CALLED_SHOW_NUMBER: "0571xxxx5678"
---
# ============================================================
# ConfigMap - Python 脚本
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: n9e-voice-script
  namespace: monitoring
data:
  n9e-voice-server.py: |
    # 请将 n9e-voice-server.py 的完整内容粘贴到这里
    # 或使用 Docker 镜像方式部署（推荐）
---
# ============================================================
# Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: n9e-voice
  namespace: monitoring
  labels:
    app: n9e-voice
spec:
  selector:
    app: n9e-voice
  ports:
    - name: http
      port: 8085
      targetPort: 8085
  type: ClusterIP
---
# ============================================================
# Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n9e-voice
  namespace: monitoring
  labels:
    app: n9e-voice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n9e-voice
  template:
    metadata:
      labels:
        app: n9e-voice
    spec:
      containers:
        - name: voice
          image: python:3.11-slim
          command: ["sh", "-c"]
          args:
            - |
              echo ">> 安装依赖..."
              pip install -q --no-cache-dir \
                alibabacloud-dyvmsapi20170525 \
                alibabacloud-tea-openapi \
                alibabacloud-tea-util \
                flask
              echo ">> 启动语音通知服务..."
              python /app/n9e-voice-server.py
          envFrom:
            - configMapRef:
                name: n9e-voice-config
            - secretRef:
                name: n9e-voice-secret
          volumeMounts:
            - name: script
              mountPath: /app
          ports:
            - name: http
              containerPort: 8085
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: script
          configMap:
            name: n9e-voice-script
            defaultMode: 0755
